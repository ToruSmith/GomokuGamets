<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>五子棋</title>
    <meta
      name="description"
      content="可離線遊玩的五子棋：連珠禁手、五段 AI、賽後分析與線上對戰。"
    />
    <meta property="og:title" content="五子棋" />
    <meta property="og:description" content="連珠禁手、強力 AI、賽後分析與線上對戰。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gomokugamets.pages.dev/" />
    <meta property="og:image" content="https://gomokugamets.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#16203a" />
    <!--head-links-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;600&display=swap"
    />
    <script>
      // 在第一次繪製前套用主題，避免閃爍
      try {
        var saved = JSON.parse(localStorage.getItem('gomoku.v2.settings') || '{}');
        if (saved.theme && saved.theme !== 'system') {
          document.documentElement.dataset.theme = saved.theme;
        }
        if (saved.skin) document.documentElement.dataset.skin = saved.skin;
      } catch (error) {}
    </script>
    <!--app-css-->
  </head>
  <body>
    <div id="app"></div>
    <!--app-js-->
    <noscript>五子棋需要啟用 JavaScript 才能遊玩。</noscript>
  </body>
</html>
